
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vem Que Tem</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff;
    }
    header img {
      width: 100%;
      max-height: 400px;
      object-fit: cover;
    }
    .btn-ofertas {
      display: block;
      width: 200px;
      margin: 20px auto;
      padding: 15px;
      background-color: #ff0099;
      color: white;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-ofertas:hover {
      background-color: #d90085;
    }
    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .produto {
      background: #f9f9f9;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .produto img {
      max-width: 100%;
      border-radius: 8px;
    }
    .rodape {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
    .rodape a {
      color: #ffcc00;
      margin: 0 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <img src="https://bruno188643.github.io/Vem-que-tem/ChatGPT%20Image%2017%20de%20abr.%20de%202025%2C%2015_38_27.png" alt="Banner Vem Que Tem" />
  </header>

  <button class="btn-ofertas">🔥 Ver Ofertas do Dia</button>

  <section class="produtos">
    <div class="produto">
      <img src="https://via.placeholder.com/180x180.png?text=Relógio" alt="Relógio">
      <p><strong>Relógio Smart</strong><br>R$129,90</p>
    </div>
    <div class="produto">
      <img src="https://via.placeholder.com/180x180.png?text=Fone" alt="Fone">
      <p><strong>Fone Bluetooth</strong><br>R$89,90</p>
    </div>
    <div class="produto">
      <img src="https://via.placeholder.com/180x180.png?text=Bolsa" alt="Bolsa">
      <p><strong>Bolsa Fashion</strong><br>R$149,90</p
